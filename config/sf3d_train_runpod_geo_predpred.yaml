# 20260726_sf3d_geo_predpred: SF3D with the symmetric pred<->pred geometric
# consistency loss replacing the two cross-GT terms.
#
# Matched line-for-line to sf3d_train_runpod_geo_crossgt.yaml except for the
# geometric block in loss_params, so the loss is the only variable.
#
# The loss couples motion_pred to trajectory_pred directly:
#     R = n̂ᵀMn̂ / tr(M)   with  M = Σᵢ dᵢdᵢᵀ over the relative trajectory
#     p = P(revolute) from motion_type_logits, gradient flowing
#     L = (1-p)(1-R) + p·R
# Prismatic wants all trajectory energy along the axis (R=1), revolute wants
# none of it (R=0). Design:
# docs/superpowers/specs/2026-07-26-pred-pred-geometric-loss-design.md
#
# WATCH val motion-type accuracy against the 96-97% baseline in
# experiments/INDEX.md. Because p carries gradient, the type head can reduce
# this loss by relabelling a sample instead of fixing the geometry; degradation
# there is the tell that it is doing so, and the cue to lower
# pred_pred_weight.

seed_everything: 42

model:
  model_params:
    clip_pretrain: "pretrain/RN50.pt" # Assumes a valid CLIP model is at this path
    word_len: 77                     # Standard CLIP context length
    use_depth: true                  # SF3D uses depth
    use_cvae: true                   # Toggle CVAE motion head (default true)
    depth_feat_channels: [128, 256]
    fpn_in: [512, 1024, 1024]      # Input channels for FPN from backbone.
    fpn_out: [256, 512, 1024]        # Output channels for FPN layers.
    # Decoder (Transformer)
    num_layers: 3                    # Number of layers in Transformer decoder
    num_head: 8                      # Number of attention heads
    dim_ffn: 1024                    # Dimension of feed-forward network in Transformer
    dropout: 0.2                     # Dropout rate in Transformer
    intermediate: False              # Whether the Transformer decoder returns intermediate layer outputs
    # Projector
    proj_dropout: 0.25
    # VAE for Motion Prediction
    vae_latent_dim: 32
    vae_hidden_dim: 256
    # motion type
    num_motion_types: 2

  loss_params:
    # Loss functions
    bce_weight: 0.5             # Weight for BCE loss in DiceBCELoss
    dice_weight: 0.5            # Weight for Dice loss in DiceBCELoss
    # loss weights
    mask_weight: 0.5           # Add this (previously implicit 1.0)
    point_map_weight: 0.5
    coord_weight: 0.5          # Weight for the L1 coordinate regression loss
    vae_weight: 0.5
    motion_type_weight: 0.5
    trajectory_weight: 0.5     # Weight for trajectory prediction loss
    # --- geometric consistency: the only block that differs between the arms
    geometric_loss: "pred_pred"       # symmetric, couples the two predictions
    pred_pred_weight: 0.1             # kept under motion_type_weight (0.5) so
                                      # the type head stays anchored by its CE
    geometric_weight: 0.5             # unused by this variant
    trajectory_to_motion_weight: 0.5  # unused by this variant
    # loss parameters
    point_sigma: 8.0            # Sigma for Gaussian heatmap generation (in pixels on the feature map)
    vae_beta: 0.01

  optimizer_params:
    lr: 0.00001
    weight_decay: 0.0001
    scheduler_milestones: [50, 55]
    scheduler_gamma: 0.1

  config:
    log_image_interval_steps: 100
    input_size: [256, 256]           # Image input size (height, width)
    enable_wandb: False
    val_vis_samples: 2
    manual_seed: 42

trainer:
  max_epochs: 60
  accelerator: "gpu"
  devices: 1
  precision: 16
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: "/workspace/SegAffordance/experiments/20260726_sf3d_geo_predpred/checkpoints"
        monitor: "val/loss_total"
        mode: "min"
        save_top_k: 3
        save_last: true
        auto_insert_metric_name: false
        filename: "best-epoch{epoch:02d}-valloss{val/loss_total:.4f}"
  logger:
    class_path: pytorch_lightning.loggers.CSVLogger
    init_args:
      save_dir: "/workspace/SegAffordance/experiments/20260726_sf3d_geo_predpred/logs"
      name: "csv"
  log_every_n_steps: 10

# RunPod paths: dataset lives on the network volume; datasets/scenefun3d.py
# additionally requires data.lmdb to be copied to /dev/shm/data.lmdb first
# (11.6GB — fits the pod's 14GB shm):
#   cp -r /workspace/datasets/sf3d_processed/data.lmdb /dev/shm/data.lmdb
data:
  train_data_dir: "/workspace/datasets/sf3d_processed"
  val_split_ratio: 0.1
  input_size: [256, 256]
  batch_size_train: 16
  batch_size_val: 16
  num_workers_train: 8
  num_workers_val: 4
  manual_seed: 42
