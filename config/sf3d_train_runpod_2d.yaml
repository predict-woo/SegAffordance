# 20260728_sf3d_2d: the 2D-arm machinery validated ON SF3D.
#
# The 2D pretraining pipeline (2D track head + projected geometric loss) was
# built for mined video, where nothing 3D can be checked. SF3D's v2 LMDB
# stores the SAME element sweep both as 3D camera-frame points and projected
# into the frame (trajectory_2d columns), so running the 2D arm here tests it
# with full 3D ground truth available for evaluation — that is this run's
# entire purpose.
#
# vs sf3d_train_runpod_geo_crossgt.yaml this changes:
#   * data.return_trajectory_2d: true — the reader emits the 15-tuple;
#     model/targets.unpack_batch normalises the pixel coords, masks on
#     trajectory_2d_valid (off-frame points carry [0,0] placeholders), and
#     derives anchor_depth from the 3D curve's first point.
#   * use_2d_trajectory_head + trajectory_2d_weight — the 2D track head,
#     supervised with the masked relative-track MSE.
#   * predict_origin_depth + geometric_loss "projected" — the 2D-arm
#     articulation supervision: does the predicted {type, axis, origin}
#     project onto the observed 2D track? (Legacy parameterisation on
#     purpose: sf3d_train_runpod_2d_twist.yaml is the twist-native,
#     prediction-anchored counterpart; running both makes the comparison.)
#
# The 3D trajectory head, cross_gt loss and all baseline heads stay on, so
# the run also shows what the extra 2D supervision does to the 3D metrics.

seed_everything: 42

model:
  model_params:
    clip_pretrain: "pretrain/RN50.pt" # Assumes a valid CLIP model is at this path
    word_len: 77                     # Standard CLIP context length
    use_depth: true                  # SF3D uses depth
    use_cvae: true                   # Toggle CVAE motion head (default true)
    use_2d_trajectory_head: true     # <-- the arm's variable
    predict_origin_depth: true       # <-- required by geometric_loss "projected"
    depth_feat_channels: [128, 256]
    fpn_in: [512, 1024, 1024]      # Input channels for FPN from backbone.
    fpn_out: [256, 512, 1024]        # Output channels for FPN layers.
    # Decoder (Transformer)
    num_layers: 3                    # Number of layers in Transformer decoder
    num_head: 8                      # Number of attention heads
    dim_ffn: 1024                    # Dimension of feed-forward network in Transformer
    dropout: 0.2                     # Dropout rate in Transformer
    intermediate: False              # Whether the Transformer decoder returns intermediate layer outputs
    # Projector
    proj_dropout: 0.25
    # VAE for Motion Prediction
    vae_latent_dim: 32
    vae_hidden_dim: 256
    # motion type
    num_motion_types: 2

  loss_params:
    # Loss functions
    bce_weight: 0.5             # Weight for BCE loss in DiceBCELoss
    dice_weight: 0.5            # Weight for Dice loss in DiceBCELoss
    # loss weights
    mask_weight: 0.5           # Add this (previously implicit 1.0)
    point_map_weight: 0.5
    coord_weight: 0.5          # Weight for the L1 coordinate regression loss
    vae_weight: 0.5
    motion_type_weight: 0.5
    trajectory_weight: 0.5     # Weight for trajectory prediction loss
    trajectory_2d_weight: 0.5  # <-- masked relative-track MSE (the 2D head)
    geometric_loss: "projected"       # <-- 2D-arm articulation supervision
    projected_weight: 0.5
    # loss parameters
    point_sigma: 8.0            # Sigma for Gaussian heatmap generation (in pixels on the feature map)
    vae_beta: 0.01

  optimizer_params:
    lr: 0.00001
    weight_decay: 0.0001
    scheduler_milestones: [13, 15]
    scheduler_gamma: 0.1

  config:
    log_image_interval_steps: 100
    input_size: [256, 256]           # Image input size (height, width)
    enable_wandb: False
    val_vis_samples: 2
    manual_seed: 42

trainer:
  # 16 epochs (~6.8M samples) fits the 8h single-GPU budget at the measured
  # in-flight rate (~250-300 samples/s, GPU-bound with the frame cache and
  # freshly warmed LMDBs). Extend from last.ckpt if the curves are still
  # moving; milestones scale with the schedule.
  max_epochs: 16
  accelerator: "gpu"
  devices: 1
  precision: 16
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: "/workspace/SegAffordance/experiments/20260728_sf3d_2d/checkpoints"
        monitor: "val/loss_total"
        mode: "min"
        save_top_k: 3
        save_last: true
        auto_insert_metric_name: false
        filename: "best-epoch{epoch:02d}-valloss{val/loss_total:.4f}"
  logger:
    class_path: pytorch_lightning.loggers.CSVLogger
    init_args:
      save_dir: "/workspace/SegAffordance/experiments/20260728_sf3d_2d/logs"
      name: "csv"
  log_every_n_steps: 10

# Requires sf3d_processed_v2 (2D trajectory columns). Warm the page cache
# before launch (train_pod.sh does):
#   cat /workspace/datasets/sf3d_processed_v2/data.lmdb/data.mdb > /dev/null
data:
  train_data_dir: "/workspace/datasets/sf3d_processed_v2"
  # Memoised sensor-filtered key list (297s -> 3s startup; created by the
  # first run, validated against the LMDB entry count and cutoff).
  key_cache_path: "/workspace/cache/sf3d_v2_keys_cutoff05.pkl"
  # Training-sized frame bytes in ONE mmap-served LMDB. Without it, per-
  # sample full-res file reads bottleneck on the FUSE daemon at ~73
  # samples/s with the GPU 75% idle (profiled 2026-07-28). Warm it
  # sequentially before launch (train_pod.sh does).
  frame_cache_path: "/workspace/datasets/sf3d_processed_v2/frames.lmdb"
  val_split_ratio: 0.1
  input_size: [256, 256]
  batch_size_train: 128
  batch_size_val: 128
  num_workers_train: 64
  num_workers_val: 32
  manual_seed: 42
  return_trajectory_2d: true    # <-- the arm's variable
