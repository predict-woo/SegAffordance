# @package _global_
# 3DOI released SAM recipe (monoarti/configs/sam.yaml) on SF3D. Differences from theirs: dataset
# names, the basic (non-Slurm) launcher, checkpoint every epoch (resumable single-shot run) and
# validation every 10 epochs on our bvalid split. Everything under optimizer/model is verbatim.
defaults:
  - defaults
  - override hydra/launcher: basic
  - _self_

experiment_name: 'sam_sf3d'
checkpoint_epoch_interval: 1
validation_epoch_interval: 10
data:
  train_dataset_names: ['3doi_sf3d']
  val_dataset_names: ['3doi_sf3d']
  test_dataset_names: ['3doi_sf3d']
  image_size: [768, 1024]
  num_workers: 4
train:
  # Their recipe is batch 2 x 4 GPUs = effective batch 8. Euler caps us at 2 GPUs, so batch 4 per
  # GPU reproduces the same effective batch (and therefore the same lr-to-batch ratio) on 2 cards.
  batch_size: 4
  depth_on: True
test:
  mode: 'export_imgs'
  split: 'val'
optimizer:
  # 62 epochs over our 32,171 frames = 1.99M image-presentations = 250,000 steps at effective
  # batch 8, i.e. exactly the optimisation budget of their released 200 epochs over their 10,000
  # images ("over 50K objects across 10K images", Qian & Fouhey ICCV'23 Sec. 4). Their literal 200
  # epochs on our larger set would be 3.2x their budget (~15 days on 2 GPUs).
  max_epochs: 62
  name: 'AdamW'
  mixed_precision: 'fp16'
  lr: 1e-4
  lr_backbone: 1e-5
  lr_scheduler_name: 'StepLR'
  lr_scheduler_step_size: 500 # epoch
  lr_scheduler_gamma: 0.1
  lbd_movable: 0.5
  lbd_rigid: 0.5
  lbd_kinematic: 0.5
  lbd_action: 0.5
  lbd_mask: 2.0
  lbd_dice: 1.0
  lbd_affordance: 400.0
  lbd_bbox: 5.0
  lbd_giou: 2.0
  lbd_axis: 2.0
  lbd_axis_offset: 10.0
  lbd_eascore: 0.0
  lbd_depth: 1.0
  clip_max_norm: 0.1
model:
  name: "sam"
  backbone_name: "vit_b"
  sam_pretrained: True
