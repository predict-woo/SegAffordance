# 20260726_sf3d_geo_crossgt: SF3D baseline arm for the geometric-consistency
# comparison.
#
# Recipe is sf3d_train_runpod.yaml unchanged (geometric_loss defaults to
# "cross_gt", stated explicitly here), with two fixes that only affect
# bookkeeping, not training:
#   * a CSVLogger, so the run produces metrics.csv (the original has
#     `logger: false` and records nothing);
#   * auto_insert_metric_name: false — "val/loss_total" in a checkpoint
#     filename otherwise creates nested directories (knowledge/infra-lessons.md).
#
# Paired with sf3d_train_runpod_geo_predpred.yaml, which differs ONLY in the
# loss_params geometric block, so the loss is the only variable.
#
# There is no SF3D row in experiments/INDEX.md yet — this run is what creates
# the baseline the pred_pred arm gets compared against.

seed_everything: 42

model:
  model_params:
    clip_pretrain: "pretrain/RN50.pt" # Assumes a valid CLIP model is at this path
    word_len: 77                     # Standard CLIP context length
    use_depth: true                  # SF3D uses depth
    use_cvae: true                   # Toggle CVAE motion head (default true)
    depth_feat_channels: [128, 256]
    fpn_in: [512, 1024, 1024]      # Input channels for FPN from backbone.
    fpn_out: [256, 512, 1024]        # Output channels for FPN layers.
    # Decoder (Transformer)
    num_layers: 3                    # Number of layers in Transformer decoder
    num_head: 8                      # Number of attention heads
    dim_ffn: 1024                    # Dimension of feed-forward network in Transformer
    dropout: 0.2                     # Dropout rate in Transformer
    intermediate: False              # Whether the Transformer decoder returns intermediate layer outputs
    # Projector
    proj_dropout: 0.25
    # VAE for Motion Prediction
    vae_latent_dim: 32
    vae_hidden_dim: 256
    # motion type
    num_motion_types: 2

  loss_params:
    # Loss functions
    bce_weight: 0.5             # Weight for BCE loss in DiceBCELoss
    dice_weight: 0.5            # Weight for Dice loss in DiceBCELoss
    # loss weights
    mask_weight: 0.5           # Add this (previously implicit 1.0)
    point_map_weight: 0.5
    coord_weight: 0.5          # Weight for the L1 coordinate regression loss
    vae_weight: 0.5
    motion_type_weight: 0.5
    trajectory_weight: 0.5     # Weight for trajectory prediction loss
    # --- geometric consistency: the only block that differs between the arms
    geometric_loss: "cross_gt"        # each pred against the OTHER head's GT
    geometric_weight: 0.5             # pred vector <-> gt traj
    trajectory_to_motion_weight: 0.5  # pred traj <-> gt vector
    # loss parameters
    point_sigma: 8.0            # Sigma for Gaussian heatmap generation (in pixels on the feature map)
    vae_beta: 0.01

  optimizer_params:
    lr: 0.00001
    weight_decay: 0.0001
    scheduler_milestones: [13, 15]
    scheduler_gamma: 0.1

  config:
    log_image_interval_steps: 100
    input_size: [256, 256]           # Image input size (height, width)
    enable_wandb: False
    val_vis_samples: 2
    manual_seed: 42

trainer:
  # 16 epochs (~6.8M samples) fits the 8h single-GPU budget at the measured
  # in-flight rate (~250-300 samples/s, GPU-bound with the frame cache and
  # freshly warmed LMDBs). Extend from last.ckpt if the curves are still
  # moving; milestones scale with the schedule.
  max_epochs: 16
  accelerator: "gpu"
  devices: 1
  precision: 16
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: "/workspace/SegAffordance/experiments/20260726_sf3d_geo_crossgt/checkpoints"
        monitor: "val/loss_total"
        mode: "min"
        save_top_k: 3
        save_last: true
        auto_insert_metric_name: false
        filename: "best-epoch{epoch:02d}-valloss{val/loss_total:.4f}"
  logger:
    class_path: pytorch_lightning.loggers.CSVLogger
    init_args:
      save_dir: "/workspace/SegAffordance/experiments/20260726_sf3d_geo_crossgt/logs"
      name: "csv"
  log_every_n_steps: 10

# sf3d_processed_v2 (2026-07-28) supersedes sf3d_processed: splat masks,
# corrected revolute arcs, sensor-occlusion filtering (reader cutoff 0.5 ->
# 417,765 records). Warm the page cache before launch (train_pod.sh does):
#   cat /workspace/datasets/sf3d_processed_v2/data.lmdb/data.mdb > /dev/null
data:
  train_data_dir: "/workspace/datasets/sf3d_processed_v2"
  # Memoised sensor-filtered key list (297s -> 3s startup; created by the
  # first run, validated against the LMDB entry count and cutoff).
  key_cache_path: "/workspace/cache/sf3d_v2_keys_cutoff05.pkl"
  # Training-sized frame bytes in ONE mmap-served LMDB. Without it, per-
  # sample full-res file reads bottleneck on the FUSE daemon at ~73
  # samples/s with the GPU 75% idle (profiled 2026-07-28). Warm it
  # sequentially before launch (train_pod.sh does).
  frame_cache_path: "/workspace/datasets/sf3d_processed_v2/frames.lmdb"
  val_split_ratio: 0.1
  input_size: [256, 256]
  batch_size_train: 128
  batch_size_val: 128
  num_workers_train: 64
  num_workers_val: 32
  manual_seed: 42
