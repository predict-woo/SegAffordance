# 20260728_sf3d_2d_twist: twist-native 2D arm on SF3D.
#
# The prediction-anchored counterpart of sf3d_train_runpod_2d.yaml (legacy,
# data-anchored). Same question — does 2D-track supervision teach 3D
# articulation? — but with the unified screw machinery:
#
#   * geometric_loss "screw" runs ALL THREE terms here: twist field vs GT 3D
#     trajectory, twist field vs own predicted trajectory, and the orbit
#     through the model's OWN anchor (coords_hat lifted with the input depth)
#     projected against the observed 2D track. No anchor_depth, no
#     origin_depth head, no line/circle branch, no radius penalty.
#   * screw_omega_shrink stays 0: the direct twist L2 pins omega on SF3D.
#     Video pretraining configs must set it > 0 — there, a short
#     low-curvature track cannot distinguish a line from a huge-radius arc
#     and nothing else supervises omega.
#
# vs sf3d_train_runpod_twist.yaml this adds: use_2d_trajectory_head,
# trajectory_2d_weight, return_trajectory_2d (the screw track term then
# activates by itself — it fires whenever a 2D track is in the batch).

seed_everything: 42

model:
  model_params:
    clip_pretrain: "pretrain/RN50.pt" # Assumes a valid CLIP model is at this path
    word_len: 77                     # Standard CLIP context length
    use_depth: true                  # SF3D uses depth
    use_cvae: true                   # Toggle CVAE motion head (default true)
    use_twist_head: true
    # GT articulation type as an auxiliary input, with conditioning
    # dropout: 50% of training samples see a learned NULL token instead,
    # and val/test ALWAYS run hint-free (NULL) -- metrics reflect the
    # no-hint deployment condition. Added 2026-08-02; the pre-typein
    # twist run (6 epochs, val 1.026) is archived and NOT comparable.
    use_motion_type_input: true
    motion_type_input_dropout: 0.5
    motion_type_embedding_dim: 16
    use_2d_trajectory_head: true
    depth_feat_channels: [128, 256]
    fpn_in: [512, 1024, 1024]      # Input channels for FPN from backbone.
    fpn_out: [256, 512, 1024]        # Output channels for FPN layers.
    # Decoder (Transformer)
    num_layers: 3                    # Number of layers in Transformer decoder
    num_head: 8                      # Number of attention heads
    dim_ffn: 1024                    # Dimension of feed-forward network in Transformer
    dropout: 0.2                     # Dropout rate in Transformer
    intermediate: False              # Whether the Transformer decoder returns intermediate layer outputs
    # Projector
    proj_dropout: 0.25
    # VAE for Motion Prediction
    vae_latent_dim: 32
    vae_hidden_dim: 256
    # motion type
    num_motion_types: 2
    # NHWC conv layout + torch.compile: 845 -> 529 ms/batch on the dev GPU
    # (1.6x; profiled 2026-08-03 — the decode-path convs/upsamples dominate
    # the step and cuDNN's NCHW->NHWC shuffling was ~5% of GPU time).
    # Numerically equivalent layout; compile pays ~minutes at first step.
    channels_last: true
    compile_model: true

  loss_params:
    # Loss functions
    bce_weight: 0.5             # Weight for BCE loss in DiceBCELoss
    dice_weight: 0.5            # Weight for Dice loss in DiceBCELoss
    # loss weights
    mask_weight: 0.5           # Add this (previously implicit 1.0)
    point_map_weight: 0.5
    coord_weight: 0.5          # Weight for the L1 coordinate regression loss
    vae_weight: 0.5
    motion_type_weight: 0.5
    trajectory_weight: 0.5     # Weight for trajectory prediction loss
    trajectory_2d_weight: 0.5  # masked relative-track MSE (the 2D head)
    twist_weight: 0.5          # sign-agnostic L2 on the twist 6-vector
    geometric_loss: "screw"
    screw_gt_weight: 0.5       # pred twist field <-> gt 3D trajectory
    screw_self_weight: 0.5     # pred twist field <-> pred trajectory @ pred point
    screw_track_weight: 0.5    # projected orbit @ pred point <-> observed 2D track
    screw_omega_shrink: 0.0    # off: twist L2 pins omega here (see header)
    # loss parameters
    point_sigma: 8.0            # Sigma for Gaussian heatmap generation (in pixels on the feature map)
    vae_beta: 0.01

  optimizer_params:
    lr: 0.00001
    weight_decay: 0.0001
    scheduler_milestones: [13, 15]
    scheduler_gamma: 0.1

  config:
    log_image_interval_steps: 100
    input_size: [256, 256]           # Image input size (height, width)
    enable_wandb: False
    val_vis_samples: 2
    manual_seed: 42

trainer:
  # 16 epochs (~6.8M samples) fits the 8h single-GPU budget at the measured
  # in-flight rate (~250-300 samples/s, GPU-bound with the frame cache and
  # freshly warmed LMDBs). Extend from last.ckpt if the curves are still
  # moving; milestones scale with the schedule.
  max_epochs: 16
  accelerator: "gpu"
  devices: 1
  precision: 16
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: "/workspace/SegAffordance/experiments/20260728_sf3d_2d_twist/checkpoints"
        monitor: "val/loss_total"
        mode: "min"
        save_top_k: 3
        save_last: true
        auto_insert_metric_name: false
        filename: "best-epoch{epoch:02d}-valloss{val/loss_total:.4f}"
  logger:
    class_path: pytorch_lightning.loggers.CSVLogger
    init_args:
      save_dir: "/workspace/SegAffordance/experiments/20260728_sf3d_2d_twist/logs"
      name: "csv"
  log_every_n_steps: 10

# Requires sf3d_processed_v2 (2D trajectory columns). Warm the page cache
# before launch (train_pod.sh does):
#   cat /workspace/datasets/sf3d_processed_v2/data.lmdb/data.mdb > /dev/null
data:
  train_data_dir: "/workspace/datasets/sf3d_processed_v2"
  # Memoised sensor-filtered key list (297s -> 3s startup; created by the
  # first run, validated against the LMDB entry count and cutoff).
  key_cache_path: "/workspace/cache/sf3d_v2_keys_cutoff05.pkl"
  # Training-sized frame bytes in ONE mmap-served LMDB. Without it, per-
  # sample full-res file reads bottleneck on the FUSE daemon at ~73
  # samples/s with the GPU 75% idle (profiled 2026-07-28). Warm it
  # sequentially before launch (train_pod.sh does).
  frame_cache_path: "/workspace/datasets/sf3d_processed_v2/frames.lmdb"
  # cv2-only decode + uint8 RGB (normalized on GPU in the model) + reused
  # mask buffers; masks/depth/bbox bit-identical to the legacy path (see
  # sf3d_train_runpod_twist.yaml for the profile numbers).
  fast_pipeline: true
  val_split_ratio: 0.1
  input_size: [256, 256]
  batch_size_train: 128
  batch_size_val: 128
  num_workers_train: 64
  num_workers_val: 32
  manual_seed: 42
  point_source: "element"
  return_trajectory_2d: true
